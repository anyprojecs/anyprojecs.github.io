<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <form>
        <input type="text" name="url" id="url" placeholder="URL" value="example.com">
        <input type="number" name="year" id="year" def placeholder="Year" min="1996" value="2026">
        <select name="month" id="month">
            <option value="01">January</option>
            <option value="02">February</option>
            <option value="03">March</option>
            <option value="04">April</option>
            <option value="05">May</option>
            <option value="06">June</option>
            <option value="07">July</option>
            <option value="08">August</option>
            <option value="09">September</option>
            <option value="10">October</option>
            <option value="11">November</option>
            <option value="12">December</option>
        </select>
        <button type="button" onclick="go()">Add</button>
        <p id="loadingIndicator">Loading...</p>
    </form>
    <main id="container">
    </main>

    <script>
        async function getUrl(url, year, month) {
            const response = await fetch("https://archive.org/wayback/available?url="+url+"&timestamp="+year+month+"01");

            if (response.ok) {
                return response.json()
            } else {
                return false
            }
        }

        function createWindow(url, title) {
            let window = document.createElement("section");
            window.setAttribute("class", "window");
            window.innerHTML = "<header>"+title+"<button onclick=closeWindow(this)>Close</button></header>";

            let iframe = document.createElement("iframe");
            iframe.setAttribute("src", url);

            window.appendChild(iframe);
            document.getElementById("container").appendChild(window);
        }

        function closeWindow(button) {
            button.closest("section").remove();
        }

        function loading(state) {
            if (state) {
                document.getElementById("loadingIndicator").style.visibility = "visible";
            } else {
                document.getElementById("loadingIndicator").style.visibility = "hidden";
            }
        }

        async function go() {
            loading(true);

            const rawUrl = document.getElementById("url").value;
            let year = document.getElementById("year").value;
            const month = document.getElementById("month").value;

            if (year < 1996) {
                year = 1996
            }

            let websiteData = await getUrl(rawUrl, year, month);

            websiteUrl = websiteData.archived_snapshots.closest.url;
            websiteUrl = "https"+websiteUrl.slice(4);

            createWindow(websiteUrl, rawUrl + " | " + year + "-" + month);

            loading(false);
        }
    </script>
</body>
</html>
